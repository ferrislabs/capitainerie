# -- Default values for the capitainerie chart. Safe for dev. Postgres, Iggy,
# FerrisKey and the LLM endpoint are external: this chart only points at them.
# Secret values are never created by the chart, see secrets.existingSecret.

nameOverride: ""
fullnameOverride: ""

global:
  # -- Image pull secrets shared by every pod.
  imagePullSecrets: []
  # -- Labels added to every resource.
  labels: {}

image:
  # -- Registry and organisation prefix. The repository of a component is
  # <prefix>-<component> unless <component>.image.repository is set.
  prefix: ghcr.io/ferrislabs/capitainerie
  pullPolicy: IfNotPresent

secrets:
  # -- Name of a Secret created out of band (External Secrets, OpenBao, sealed
  # secret). The chart only references it. The key of each entry is the name
  # of the environment variable. Keys read by each component are listed in
  # <component>.secretEnv.
  existingSecret: capitainerie
  # -- Variables read from the Secret with `optional: true` (the application has a default).
  optionalKeys:
    - LLM_API_KEY

config:
  # -- Value of LOG_FILTER (tracing EnvFilter).
  logFilter: info
  # -- Value of LOG_JSON.
  logJson: true
  # -- Value of OTLP_ENDPOINT. Empty disables the OTLP export.
  otlpEndpoint: ""
  # -- Value of DATABASE_MAX_CONNECTIONS per pod.
  databaseMaxConnections: 10
  # -- Value of MCP_AUDIENCE (audience of the delegated agent tokens).
  mcpAudience: capitainerie-mcp
  # -- Client ids of the agents a run acts through (PIPELINE_AGENTS on api and worker, MCP_ACCEPTED_AGENTS on mcp-kanban).
  pipelineAgents:
    - capitainerie-agent-writer
  github:
    # -- URL name of the GitHub App (GITHUB_APP_SLUG): the install link is github.com/apps/<slug>/installations/new.
    appSlug: ""
    # -- GITHUB_API_BASE, for GitHub Enterprise. Empty keeps https://api.github.com.
    apiBase: ""
  iggy:
    # -- host:port of the Iggy TCP endpoint (IGGY_ADDRESS).
    address: iggy:8090
    stream: capitainerie
    partitions: 3

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

topologySpread:
  # -- Spread replicas across nodes (ScheduleAnyway, so a single node still schedules).
  enabled: true

api:
  enabled: true
  replicaCount: 2
  image:
    # -- Overrides <image.prefix>-api.
    repository: ""
    # -- Defaults to .Chart.AppVersion.
    tag: ""
  # -- Value of SERVER_PORT.
  port: 4100
  # -- Origins allowed by CORS (ALLOWED_ORIGINS). Follows the console host.
  allowedOrigins:
    - http://localhost:4080
  # -- Client ids whose tokens are accepted (AUTH_ACCEPTED_CLIENTS, the `azp`).
  acceptedClients:
    - capitainerie-console
  # -- Required audience (AUTH_AUDIENCE), the API resource indicator the console requests at login.
  audience: ""
  secretEnv:
    - DATABASE_URL
    - DELEGATION_KEY
    - SECRETS_KEY
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY
    - EXCHANGE_CLIENT_ID
    - EXCHANGE_CLIENT_SECRET
    - AGENT_CREDENTIALS
    - IGGY_USERNAME
    - IGGY_PASSWORD
  # -- Extra environment variables (list of EnvVar).
  extraEnv: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 4100
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

mcpKanban:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    tag: ""
  # -- Value of MCP_PORT.
  port: 4101
  # -- Public URL of the MCP server (MCP_PUBLIC_URL), advertised in the protected resource metadata.
  publicUrl: http://localhost:4101
  secretEnv:
    - DATABASE_URL
  extraEnv: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 4101
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  # -- Value of MCP_URL. Empty uses the in-cluster mcp-kanban Service.
  mcpUrl: ""
  # -- Value of CONSOLE_URL, linked from the pull requests of executions. Empty omits the link.
  consoleUrl: ""
  llm:
    # -- OpenAI-compatible endpoint (LLM_BASE_URL).
    baseUrl: http://ollama:11434/v1
    model: qwen2.5:7b-instruct
    timeoutSecs: 300
    # -- Micro-units per million input tokens (0 for a local model).
    priceInputPerMtokMicros: 0
    priceOutputPerMtokMicros: 0
  # -- Runs executed at once per pod (WORKER_CONCURRENCY).
  concurrency: 2
  embedding:
    # -- OpenAI-compatible embeddings model on the same endpoint (EMBEDDING_MODEL). Pull it
    # next to the chat model.
    model: bge-m3
  # -- Cosine similarity from which an action is a duplicate of an existing card
  # (calibrated on French paraphrases with bge-m3).
  dedupThreshold: 0.75
  # -- Cosine similarity below which an action is a new card without asking the model
  # (DEDUP_GRAY_FLOOR). From this score up to dedupThreshold the chat model judges the
  # closest card. Must not exceed dedupThreshold.
  dedupGrayFloor: 0.65
  vectorStore:
    # -- LANCEDB_URI. A local directory needs a single worker writing it: keep replicaCount
    # at 1, or move to an object store.
    uri: /var/lib/capitainerie/lancedb
    persistence:
      # -- When false the index lives in an emptyDir and is rebuilt from the cards at each
      # start (the indexer backfills an empty table).
      enabled: false
      existingClaim: ""
      size: 2Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
  secretEnv:
    - DATABASE_URL
    - DELEGATION_KEY
    - SECRETS_KEY
    - EXCHANGE_CLIENT_ID
    - EXCHANGE_CLIENT_SECRET
    - AGENT_CREDENTIALS
    - IGGY_USERNAME
    - IGGY_PASSWORD
    - LLM_API_KEY
  extraEnv: []
  podAnnotations: {}
  # -- Must exceed the time a run takes to stop. Interrupted runs resume at the first unfinished step.
  terminationGracePeriodSeconds: 90
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

executor:
  # -- Runs Claude Code on validated cards, one Job per execution, in its own namespace.
  # Creates the tasks namespace, its NetworkPolicy, the worker RBAC and the egress proxy.
  enabled: false
  # -- Namespace of the task Jobs (created by the chart).
  namespace: capitainerie-tasks
  image:
    # -- Overrides <image.prefix>-executor.
    repository: ""
    # -- Defaults to .Chart.AppVersion.
    tag: ""
  # -- Value of EXECUTOR_MAX_TURNS (--max-turns of Claude Code).
  maxTurns: 50
  # -- Value of EXECUTOR_DEADLINE_SECS (activeDeadlineSeconds of the Job).
  deadlineSeconds: 1800
  # -- Where the task pods resolve names (DNS egress).
  dnsTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns

egressProxy:
  # -- Deployed with executor.enabled. The only network exit of the task pods.
  replicaCount: 2
  image:
    repository: ""
    tag: ""
  # -- Value of EGRESS_PROXY_PORT.
  port: 4130
  secretEnv:
    - DATABASE_URL
    - SECRETS_KEY
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY
  extraEnv: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 4130
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

exporter:
  enabled: true
  image:
    repository: ""
    tag: ""
  # -- Parquet files are flushed after this many events (ANALYTICS_FLUSH_EVENTS)...
  flushEvents: 500
  # -- ...or after this many seconds (ANALYTICS_FLUSH_SECS), whichever comes first.
  flushSecs: 30
  secretEnv:
    - IGGY_USERNAME
    - IGGY_PASSWORD
  extraEnv: []
  podAnnotations: {}
  # -- A SIGTERM flushes the buffered events before the exit.
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

analytics:
  # -- Directory of the Parquet dataset (ANALYTICS_URI) inside the exporter and api pods.
  # Only local directories are supported for now.
  mountPath: /var/lib/capitainerie/analytics
  persistence:
    # -- Keeps the dataset on a PersistentVolumeClaim. When false the exporter writes to an
    # emptyDir: the dataset is lost whenever the pod is rescheduled and the api never sees it.
    enabled: false
    # -- Uses this claim instead of creating one.
    existingClaim: ""
    size: 5Gi
    storageClass: ""
    # -- The api mounts the same claim read-only: use ReadWriteMany, or pin both pods to one node.
    accessModes:
      - ReadWriteMany
    annotations: {}

console:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    tag: ""
  # -- Runtime configuration rendered into config.json by the entrypoint.
  config:
    # -- API_URL, public URL of the api.
    apiUrl: http://localhost:4100
    # -- OIDC_ISSUER_URL, FerrisKey realm issuer.
    oidcIssuerUrl: ""
    # -- OIDC_CLIENT_ID, public client of the console.
    oidcClientId: capitainerie-console
    # -- OIDC_RESOURCE, resource indicator requested at login (the api audience).
    oidcResource: ""
    # -- TRACES_URL, OTLP/HTTP traces endpoint reachable from the browser. Empty disables.
    tracesUrl: ""
  extraEnv: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  # -- Runs `sqlx migrate run` as an ArgoCD PreSync hook before the new pods.
  enabled: true
  image:
    repository: ""
    tag: ""
  secretEnv:
    - DATABASE_URL
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

gateway:
  # -- Creates the Gateway API HTTPRoutes.
  enabled: false
  # -- parentRefs of the shared Gateway (required when enabled).
  parentRefs: []
  # -- Hostnames shared by the routes. One host per environment, path-routed.
  hostnames: []
  api:
    # -- Overrides gateway.hostnames.
    hostnames: []
    pathPrefixes:
      - /api
  mcp:
    hostnames: []
    pathPrefixes:
      - /mcp
      - /.well-known/oauth-protected-resource
  console:
    hostnames: []
    pathPrefixes:
      - /

networkPolicy:
  # -- Creates a NetworkPolicy per component (ingress and egress restricted).
  enabled: false
  # -- Peers allowed to reach api, mcp-kanban and console (the Gateway data plane).
  gatewayFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
  # -- Peers for DNS.
  dnsTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # -- External dependencies. `to` is a list of NetworkPolicyPeer; empty means any
  # destination on the listed ports. Narrow it with the namespace or CIDR of the dependency.
  external:
    postgres:
      to: []
      ports: [5432]
    iggy:
      to: []
      ports: [8090]
    ferriskey:
      to: []
      ports: [443]
    llm:
      to: []
      ports: [443, 11434]
    otlp:
      to: []
      ports: [4317, 4318]
    # -- Kubernetes API, reached by the worker when executor.enabled.
    kubeApi:
      to: []
      ports: [443, 6443]
    # -- api.anthropic.com and github.com, reached by the egress proxy.
    upstream:
      to: []
      ports: [443]
