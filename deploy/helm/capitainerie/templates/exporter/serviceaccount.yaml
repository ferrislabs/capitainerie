{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capitainerie.componentName" (dict "root" . "component" "exporter") }}
  labels:
    {{- include "capitainerie.labels" (dict "root" . "component" "exporter") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
