{{- if .Values.executor.enabled }}
{{- $ctx := dict "root" . "component" "executor" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.executor.namespace }}
  labels:
    {{- include "capitainerie.labels" $ctx | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-tasks
  namespace: {{ .Values.executor.namespace }}
  labels:
    {{- include "capitainerie.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "capitainerie.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.egressProxy.port }}
    - to:
        {{- toYaml .Values.executor.dnsTo | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
