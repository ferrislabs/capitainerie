{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capitainerie.componentName" (dict "root" . "component" "worker") }}
  labels:
    {{- include "capitainerie.labels" (dict "root" . "component" "worker") | nindent 4 }}
automountServiceAccountToken: {{ .Values.executor.enabled }}
{{- end }}
