{{- if .Values.console.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capitainerie.componentName" (dict "root" . "component" "console") }}
  labels:
    {{- include "capitainerie.labels" (dict "root" . "component" "console") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
