{{- if .Values.gateway.enabled }}
{{- $parentRefs := .Values.gateway.parentRefs }}
{{- if not $parentRefs }}
{{- fail "gateway.parentRefs is required when gateway.enabled" }}
{{- end }}
{{- $routes := list
  (dict "component" "api" "enabled" .Values.api.enabled "route" .Values.gateway.api "port" .Values.api.service.port)
  (dict "component" "mcp-kanban" "enabled" .Values.mcpKanban.enabled "route" .Values.gateway.mcp "port" .Values.mcpKanban.service.port)
  (dict "component" "console" "enabled" .Values.console.enabled "route" .Values.gateway.console "port" .Values.console.service.port) }}
{{- range $routes }}
{{- if .enabled }}
{{- $ctx := dict "root" $ "component" .component }}
{{- $name := include "capitainerie.componentName" $ctx }}
{{- $hostnames := default $.Values.gateway.hostnames .route.hostnames }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "capitainerie.labels" $ctx | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .route.pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ $name }}
          port: {{ .port }}
{{- end }}
{{- end }}
{{- end }}
