{{- if and .Values.mcpKanban.enabled .Values.mcpKanban.podDisruptionBudget.enabled }}
{{- $ctx := dict "root" . "component" "mcp-kanban" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "capitainerie.componentName" $ctx }}
  labels:
    {{- include "capitainerie.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.mcpKanban.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "capitainerie.selectorLabels" $ctx | nindent 6 }}
{{- end }}
