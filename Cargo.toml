[workspace]
members = [
    "apps/api",
    "apps/egress-proxy",
    "apps/exporter",
    "apps/mcp-kanban",
    "apps/worker",
    "libs/analytics",
    "libs/args",
    "libs/auth",
    "libs/bus-iggy",
    "libs/common",
    "libs/events",
    "libs/github",
    "libs/core",
    "libs/handlers",
    "libs/handlers-analytics",
    "libs/handlers-cards",
    "libs/handlers-identity",
    "libs/handlers-integrations",
    "libs/handlers-providers",
    "libs/handlers-realtime",
    "libs/handlers-runs",
    "libs/macros",
    "libs/runner-kube",
    "libs/runtime-rig",
    "libs/telemetry",
    "libs/vector-lancedb",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Nathael Bonnal <pro.nathaelbonnal@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
aws-lc-rs = "1.16"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-routing"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.1", features = ["env", "derive"] }
dotenvy = "0.15.7"
mockall = "0.13.1"
iggy = "0.11.0"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.31.0"
proc-macro2 = "1.0.103"
http = "1.5.0"
quote = "1.0.42"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rig-agent = "=0.44.0"
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls", "derive"] }
rig-reqwest = { version = "=0.44.0", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.110", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "json"] }
thiserror = "2.0.18"
futures-util = "0.3.34"
tokio-tungstenite = "0.29.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

# Arrow stack, shared by LanceDB and DataFusion: lancedb 0.40 pins arrow 58 and
# datafusion 54. Bump all four together, never one alone.
arrow-array = "58.3"
arrow-schema = "58.3"
datafusion = { version = "54.1", default-features = false, features = ["parquet"] }
lancedb = { version = "0.40.0", default-features = false }
parquet = { version = "58.4", default-features = false, features = ["arrow", "async", "zstd"] }

capitainerie-analytics = { path = "libs/analytics" }
capitainerie-args = { path = "libs/args" }
capitainerie-auth = { path = "libs/auth" }
capitainerie-bus-iggy = { path = "libs/bus-iggy" }
capitainerie-common = { path = "libs/common" }
capitainerie-events = { path = "libs/events" }
capitainerie-github = { path = "libs/github" }
capitainerie-core = { path = "libs/core" }
capitainerie-handlers = { path = "libs/handlers" }
capitainerie-handlers-analytics = { path = "libs/handlers-analytics" }
capitainerie-handlers-cards = { path = "libs/handlers-cards" }
capitainerie-handlers-identity = { path = "libs/handlers-identity" }
capitainerie-handlers-integrations = { path = "libs/handlers-integrations" }
capitainerie-handlers-providers = { path = "libs/handlers-providers" }
capitainerie-handlers-realtime = { path = "libs/handlers-realtime" }
capitainerie-handlers-runs ={ path = "libs/handlers-runs" }
capitainerie-macros = { path = "libs/macros" }
capitainerie-runner-kube = { path = "libs/runner-kube" }
capitainerie-runtime-rig = { path = "libs/runtime-rig" }
capitainerie-telemetry = { path = "libs/telemetry" }
capitainerie-vector-lancedb = { path = "libs/vector-lancedb" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
