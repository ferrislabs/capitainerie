[workspace]
members = [
    "apps/api",
    "apps/mcp-kanban",
    "apps/worker",
    "libs/args",
    "libs/common",
    "libs/core",
    "libs/handlers",
    "libs/telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Nathael Bonnal <pro.nathaelbonnal@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.1", features = ["env", "derive"] }
dotenvy = "0.15.7"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.31.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

capitainerie-args = { path = "libs/args" }
capitainerie-common = { path = "libs/common" }
capitainerie-core = { path = "libs/core" }
capitainerie-handlers = { path = "libs/handlers" }
capitainerie-telemetry = { path = "libs/telemetry" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
